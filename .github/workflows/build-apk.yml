name: Build & Sign Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK (V1+V2+V3)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Prepare Signing Keystore
        id: prepare-keystore
        run: |
          mkdir -p keystore
          mkdir -p app/keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding Keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "No KEYSTORE_BASE64 secret provided. Generating CI temporary signing keystore..."
            keytool -genkeypair -v \
              -keystore keystore/release.keystore \
              -alias key0 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype PKCS12 \
              -storepass android \
              -keypass android \
              -dname "CN=DualAppCI, OU=CI, O=DualApp, L=Shenzhen, ST=Guangdong, C=CN"
            echo "has_keystore=fallback" >> $GITHUB_OUTPUT
          fi
          cp keystore/release.keystore app/keystore/release.keystore
          ls -lh keystore/release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'key0' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          ./gradlew assembleRelease --stacktrace > build.log 2>&1 || { cat build.log; exit 1; }

      - name: Push Build Log to Debug Branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-build-log
          git add -f build.log
          git commit -m "chore: save CI build log" || true
          git push origin ci-build-log --force || true

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Verify V1 + V2 + V3 Signatures
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "Found Release APK: $APK_FILE"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$APK_FILE" || true
          else
            echo "No APK found in release output directory!"
            exit 1
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualAppShortcut-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace || true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f keystore/release.keystore app/keystore/release.keystore
